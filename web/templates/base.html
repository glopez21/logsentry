<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSentry{% block title %}{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a; color: #e2e8f0; line-height: 1.6;
        }
        nav {
            background: #1e293b; padding: 0.75rem 1.5rem; border-bottom: 1px solid #334155;
            display: flex; align-items: center; gap: 1.5rem;
        }
        nav .brand { font-weight: 700; font-size: 1.25rem; color: #38bdf8; text-decoration: none; }
        nav a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
        nav a:hover, nav a.active { color: #38bdf8; }
        nav .spacer { flex: 1; }
        nav .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 0.35rem; animation: pulse-dot 1.5s infinite; }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .card {
            background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem;
            padding: 1.25rem; margin-bottom: 1rem;
        }
        .card h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
        .stat { text-align: center; }
        .stat .value { font-size: 2rem; font-weight: 700; }
        .stat .label { font-size: 0.8rem; color: #64748b; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #334155; vertical-align: top; }
        th { color: #94a3b8; font-weight: 600; }
        tr:hover { background: #0f172a; }
        .sev-critical { color: #ef4444; font-weight: 700; }
        .sev-high { color: #f97316; }
        .sev-medium { color: #eab308; }
        .sev-low { color: #22c55e; }
        .sev-info { color: #64748b; }
        input, select {
            background: #0f172a; border: 1px solid #334155; border-radius: 0.25rem;
            padding: 0.4rem 0.6rem; color: #e2e8f0; font-size: 0.85rem;
        }
        button {
            background: #38bdf8; color: #0f172a; border: none; border-radius: 0.25rem;
            padding: 0.4rem 1rem; font-weight: 600; cursor: pointer; font-size: 0.85rem;
        }
        button:hover { background: #7dd3fc; }
        button.secondary { background: #334155; color: #e2e8f0; }
        button.secondary:hover { background: #475569; }
        .filters { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
        .badge {
            display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
            font-size: 0.75rem; font-weight: 600;
        }
        .badge-critical { background: #ef444420; color: #ef4444; }
        .badge-high { background: #f9731620; color: #f97316; }
        .badge-medium { background: #eab30820; color: #eab308; }
        .badge-low { background: #22c55e20; color: #22c55e; }
        .badge-info { background: #64748b20; color: #64748b; }
        .badge-mitre { background: #a855f720; color: #c084fc; font-family: monospace; }
        .sev-bg-critical { background: #ef4444; }
        .sev-bg-high { background: #f97316; }
        .sev-bg-medium { background: #eab308; }
        .sev-bg-low { background: #22c55e; }
        .sev-bg-info { background: #475569; }
        .bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem; }
        .bar-label { width: 90px; flex-shrink: 0; }
        .bar-track { flex: 1; background: #0f172a; border-radius: 999px; height: 14px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 999px; }
        .bar-count { width: 70px; text-align: right; color: #94a3b8; font-size: 0.8rem; flex-shrink: 0; }
        .pagination { display: flex; gap: 0.5rem; align-items: center; justify-content: center; margin-top: 1rem; }
        .pagination a, .pagination span {
            color: #94a3b8; text-decoration: none; padding: 0.25rem 0.7rem;
            border: 1px solid #334155; border-radius: 0.25rem; font-size: 0.85rem;
        }
        .pagination a:hover { border-color: #38bdf8; color: #38bdf8; }
        .pagination .current { background: #38bdf820; border-color: #38bdf8; color: #38bdf8; }
        details.raw td { white-space: pre-wrap; word-break: break-all; }
        details.raw summary { cursor: pointer; color: #38bdf8; list-style: none; }
        .muted { color: #64748b; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8rem; }
        #tail-box {
            background: #0b1120; border: 1px solid #334155; border-radius: 0.5rem;
            height: 65vh; overflow-y: auto; padding: 0.75rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.78rem;
        }
        #tail-box .line { padding: 0.1rem 0; border-bottom: 1px solid #1e293b; white-space: pre-wrap; word-break: break-all; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/web/" class="brand">LogSentry</a>
        <a href="/web/">Dashboard</a>
        <a href="/web/logs">Logs</a>
        <a href="/web/detections">Detections</a>
        <a href="/web/tail"><span class="live-dot"></span>Live Tail</a>
        <span class="spacer"></span>
        <a href="/health">Health</a>
        <a href="/docs">API</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
