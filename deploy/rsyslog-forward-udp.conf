# LogSentry rsyslog forwarder (UDP)
# Copy to /etc/rsyslog.d/90-logsentry.conf and restart rsyslog.

module(load="imuxsock")    # local syslog
module(load="imklog")      # kernel logging
module(load="omfwd")

$ActionQueueType LinkedList
$ActionQueueFileName logsentry
$ActionQueueSaveOnShutdown on
$ActionResumeRetryCount -1

# Forward all facilities at all priorities
*.* @LOGSENTRY_HOST:514;RSYSLOG_SyslogProtocol23Format

# Keep local0 for agent logs (stay local)
local0.*    /var/log/logsentry-agent.log
