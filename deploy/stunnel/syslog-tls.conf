; stunnel TLS terminator for syslog TCP 514 -> logsentry

pid = /var/run/stunnel-syslog.pid
compression = zlib
foreground = no
debug = notice

[syslog]
accept = 0.0.0.0:6514
connect = logsentry:514
client = no
verifyChain = yes
CAfile = /etc/stunnel/ca.crt
cert = /etc/stunnel/server.crt
key = /etc/stunnel/server.key
