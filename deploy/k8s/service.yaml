apiVersion: v1
kind: Service
metadata:
  name: logsentry
spec:
  selector:
    app: logsentry
  type: LoadBalancer
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 514
      protocol: UDP
    - name: syslog-tcp
      port: 514
      targetPort: 514
      protocol: TCP
    - name: api
      port: 8080
      targetPort: 8080
      protocol: TCP
