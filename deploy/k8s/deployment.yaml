apiVersion: apps/v1
kind: Deployment
metadata:
  name: logsentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logsentry
  template:
    metadata:
      labels:
        app: logsentry
    spec:
      containers:
        - name: logsentry
          image: ghcr.io/glopez21/logsentry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: syslog-udp
              containerPort: 514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 514
              protocol: TCP
            - name: api
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: logsentry-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/logsentry/logsentry.yaml
              subPath: logsentry.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: logsentry-config
