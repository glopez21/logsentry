apiVersion: v1
kind: ConfigMap
metadata:
  name: logsentry-config
data:
  logsentry.yaml: |
    engine:
      mode: daemon
      log_level: info
      detection_interval: 30
      stats_interval: 60
    storage:
      dsn: ${LOGSENTRY_DSN}
      pool_min: 2
      pool_max: 10
      retention_days: 90
      batch_size: 500
      flush_interval: 5
    ingest:
      syslog:
        enabled: true
        bind: 0.0.0.0
        port: 514
        protocol: udp
      http:
        enabled: true
      file_watchers:
        enabled: false
        paths: []
    detection:
      enabled: true
      alerts:
        stdout:
          enabled: true
          format: json
    server:
      host: 0.0.0.0
      port: 8080
      api_key: ${LOGSENTRY_API_KEY}
