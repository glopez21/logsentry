# LogSentry rsyslog forwarder (TCP + TLS)
# Requirements: rsyslog with gtls support, CA cert of the LogSentry endpoint.
# Replace placeholders and copy to /etc/rsyslog.d/90-logsentry-tls.conf

module(load="imuxsock")
module(load="imklog")
module(load="omfwd")
module(load="gtls")

# TLS settings
$DefaultNetstreamDriver gtls
$DefaultNetstreamDriverCAFile /etc/rsyslog.d/certs/ca.crt
# Optional: client cert/key for mutual TLS
# $DefaultNetstreamDriverCertFile /etc/rsyslog.d/certs/client.crt
# $DefaultNetstreamDriverKeyFile  /etc/rsyslog.d/certs/client.key

$ActionQueueType LinkedList
$ActionQueueFileName logsentry
$ActionQueueSaveOnShutdown on
$ActionResumeRetryCount -1

# Forward all logs via TCP with TLS
*.* @@LOGSENTRY_HOST:514;RSYSLOG_SyslogProtocol23Format

local0.*    /var/log/logsentry-agent.log
