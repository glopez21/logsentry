services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logsentry
      POSTGRES_USER: logsentry
      POSTGRES_PASSWORD: ${LOGSENTRY_DB_PASSWORD:-logsentry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logsentry"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logsentry:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOGSENTRY_DSN: postgresql://logsentry:${LOGSENTRY_DB_PASSWORD:-logsentry}@postgres:5432/logsentry
      LOGSENTRY_MODE: daemon
      LOGSENTRY_API_KEY: ${LOGSENTRY_API_KEY:-}
      VT_API_KEY: ${VT_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      AUGUR_URL: ${AUGUR_URL:-http://augur:8001}
      AUGUR_API_KEY: ${AUGUR_API_KEY:-}
      AUGUR_AGENT_NAME: ${AUGUR_AGENT_NAME:-logsentry}
      THREATPULSE_URL: ${THREATPULSE_URL:-}
      THREATPULSE_API_KEY: ${THREATPULSE_API_KEY:-}
      SPLUNK_ENDPOINT: ${SPLUNK_ENDPOINT:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      ALERTFLOW_URL: ${ALERTFLOW_URL:-http://alertflow:8000}
      ALERTFLOW_API_KEY: ${ALERTFLOW_API_KEY:-}
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:9092}
    ports:
      - "514:514/udp"
      - "514:514/tcp"
      - "8080:8080"
    volumes:
      - logs:/var/log
      - ./logsentry.yaml:/etc/logsentry/logsentry.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - proxy-net
      - alertflow-net
    labels:
      - "4rch3.io.enable=true"
      - "4rch3.io.service=logsentry"
      - "4rch3.io.name=LogSentry"
      - "4rch3.io.description=Security log parsing, detection, and SIEM export"
      - "4rch3.io.url=https://logsentry.4rch3.io"
      - "4rch3.io.health=/health"
      - "4rch3.io.port=8080"
      - "4rch3.io.public=true"
      - "4rch3.io.category=security"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.logsentry.rule=Host(`logsentry.4rch3.io`)"
      - "traefik.http.routers.logsentry.entrypoints=websecure"
      - "traefik.http.routers.logsentry.tls=true"
      - "traefik.http.routers.logsentry.tls.certresolver=cloudflare"
      - "traefik.http.routers.logsentry.middlewares=security-headers@file,cf-access-auth@file"
      - "traefik.http.services.logsentry.loadbalancer.server.port=8080"

  # Init: run --init-db once, then exit
  db-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOGSENTRY_DSN: postgresql://logsentry:${LOGSENTRY_DB_PASSWORD:-logsentry}@postgres:5432/logsentry
    command: ["daemon", "--init-db"]
    restart: no

volumes:
  pgdata:
  logs:

networks:
  proxy-net:
    external: true
    name: proxy-net
  alertflow-net:
    external: true
    name: alertflow-net
