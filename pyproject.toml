[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "logsentry"
version = "0.2.0"
description = "Security log parsing toolkit for SOC analysts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "w01f", email = "" }
]
keywords = ["security", "soc", "log-analysis", "siem", "mitre-attack", "threat-intel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "pandas>=3.0.2",
    "rich>=15.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.23"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.0", "pytest-cov", "types-PyYAML", "pandas-stubs"]
integrations = ["stix2>=3.0"]

[project.scripts]
logsentry = "main:main"

[project.urls]
Homepage = "https://github.com/w01f/logsentry"
Repository = "https://github.com/w01f/logsentry"
Documentation = "https://github.com/w01f/logsentry#readme"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["logsentry"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "schedule", "sigma.*", "generate_logs"]
ignore_missing_imports = true