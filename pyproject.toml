[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "logsentry"
version = "0.2.0"
description = "Security log parsing toolkit for SOC analysts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "w01f", email = "" }
]
keywords = ["security", "soc", "log-analysis", "siem", "mitre-attack", "threat-intel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "pandas>=3.0.2",
    "rich>=15.0.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "n3xuslib @ git+https://github.com/glopez21/n3xuslib.git",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.23", "websockets>=12.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.0", "pytest-cov", "types-PyYAML", "pandas-stubs"]
integrations = ["stix2>=3.0"]
async = ["asyncpg>=0.29"]
augur = ["augur-client @ git+https://github.com/glopez21/augur-client.git"]

[project.scripts]
logsentry = "main:main"

[project.urls]
Homepage = "https://github.com/glopez21/logsentry"
Repository = "https://github.com/glopez21/logsentry"
Documentation = "https://github.com/glopez21/logsentry#readme"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/main.py",
    "/daemon.py",
]

[tool.hatch.build.targets.wheel]
packages = [
    "alerters", "alerts", "analytics", "attack_timeline",
    "baselines", "collector", "config", "dashboard",
    "db", "detection", "integrations", "integrity",
    "navigator", "notifiers", "output", "parsers",
    "rules", "siem", "threat_intel", "yara_rules",
]
force-include = {"main.py" = "main.py", "daemon.py" = "daemon.py", "n3xus.py" = "n3xus.py"}

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "schedule", "generate_logs", "psycopg2", "psycopg2.pool", "psycopg2.extras"]
ignore_missing_imports = true